spring.application.name=CSplash


#Configuracao do BD
spring.datasource.url=jdbc:mysql://localhost:3306/splashhelp?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#Configuracao Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


api.security.token.secret=${JWT_SECRET:my-secret-key}

logging.level.org.springframework.security=DEBUG


#configurando ficheiro
# Define o tamanho máximo permitido para cada arquivo individual
spring.servlet.multipart.max-file-size=10MB

# Define o tamanho máximo total da requisição (incluindo JSON + Imagem)
spring.servlet.multipart.max-request-size=10MB